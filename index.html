<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple student task planner built with HTML, CSS and JavaScript.">
  <title>StudyFlow — Student Task Planner</title>
  <style>
    :root {
      --ink: #20243a; --muted: #73788d; --bg: #f4f6fb; --card: #ffffff;
      --blue: #536dfe; --blue-dark: #4057e8; --line: #e8eaf2;
      --green: #1b9b70; --red: #d84b61; --shadow: 0 14px 40px rgba(35,45,90,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink); background: radial-gradient(circle at top left, #e8edff 0, transparent 34%), var(--bg);
    }
    .app { width: min(760px, 100%); margin: 0 auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:26px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:46px; height:46px; display:grid; place-items:center; border-radius:15px; color:white; background:var(--blue); font-size:23px; box-shadow:0 8px 18px #536dfe55; }
    h1 { font-size:23px; margin:0; letter-spacing:-.7px; }
    .tagline { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .date { color:var(--muted); font-size:13px; text-align:right; }
    .hero { background:linear-gradient(120deg,#536dfe,#7b8cff); color:white; border-radius:22px; padding:25px 26px; box-shadow:var(--shadow); }
    .hero h2 { margin:0 0 7px; font-size:22px; letter-spacing:-.5px; }
    .hero p { margin:0; color:#e8ebff; font-size:14px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0 20px; }
    .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; }
    .stat strong { display:block; font-size:24px; margin-bottom:3px; }
    .stat span { color:var(--muted); font-size:12px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:21px; box-shadow:var(--shadow); }
    .panel h3 { margin:0 0 15px; font-size:16px; }
    form { display:grid; grid-template-columns:1fr 145px auto; gap:9px; }
    input, select, button { font:inherit; }
    input, select { min-width:0; border:1px solid var(--line); background:#fbfcff; color:var(--ink); border-radius:11px; padding:12px 13px; outline:none; }
    input:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px #536dfe1c; }
    button { border:0; border-radius:11px; padding:11px 16px; color:white; background:var(--blue); font-weight:650; cursor:pointer; transition:.18s; }
    button:hover { background:var(--blue-dark); transform:translateY(-1px); }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:22px 0 12px; }
    .toolbar h3 { margin:0; font-size:16px; }
    .filters { display:flex; gap:6px; flex-wrap:wrap; }
    .filter { color:var(--muted); background:transparent; padding:7px 10px; font-size:12px; }
    .filter.active { color:var(--blue); background:#eef0ff; }
    .tasks { display:grid; gap:9px; }
    .task { display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:13px; padding:12px; }
    .task input[type=checkbox] { width:18px; height:18px; accent-color:var(--green); flex:0 0 auto; }
    .task-main { flex:1; min-width:0; }
    .task-title { font-size:14px; overflow-wrap:anywhere; }
    .task.done .task-title { color:#9a9eac; text-decoration:line-through; }
    .priority { display:inline-block; margin-top:5px; padding:3px 7px; border-radius:20px; font-size:10px; background:#f0f2f8; color:var(--muted); }
    .priority.High { color:#c34457; background:#fff0f2; }
    .priority.Medium { color:#9a6b14; background:#fff7e5; }
    .delete { background:#fff1f3; color:var(--red); padding:8px 10px; font-size:12px; }
    .delete:hover { background:#ffe2e7; }
    .empty { text-align:center; padding:28px 12px; color:var(--muted); font-size:14px; }
    footer { text-align:center; color:#9297a8; font-size:11px; margin:18px 0 0; }
    @media(max-width:560px) {
      body { padding:22px 13px; } header { align-items:flex-start; }
      .date { max-width:105px; line-height:1.5; }
      form { grid-template-columns:1fr 1fr; }
      form input { grid-column:1 / -1; }
      form button { grid-column:1 / -1; }
      .stats { gap:8px; } .stat { padding:12px 10px; }
      .stat strong { font-size:21px; } .stat span { font-size:11px; }
      .panel { padding:16px; } .toolbar { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">✓</div>
        <div><h1>StudyFlow</h1><p class="tagline">A little more organised, every day.</p></div>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="hero">
      <h2>Make today count.</h2>
      <p>Add your assignments, revision goals and everyday tasks in one place.</p>
    </section>

    <section class="stats" aria-label="Task summary">
      <div class="stat"><strong id="total">0</strong><span>Total tasks</span></div>
      <div class="stat"><strong id="remaining">0</strong><span>To do</span></div>
      <div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
    </section>

    <section class="panel">
      <h3>Add a task</h3>
      <form id="taskForm">
        <input id="taskInput" type="text" maxlength="90" placeholder="e.g. Complete DBMS assignment" aria-label="Task name" required>
        <select id="priority" aria-label="Task priority">
          <option value="Low">Low priority</option>
          <option value="Medium" selected>Medium priority</option>
          <option value="High">High priority</option>
        </select>
        <button type="submit">+ Add task</button>
      </form>

      <div class="toolbar">
        <h3>Your tasks</h3>
        <div class="filters" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">To do</button>
          <button class="filter" data-filter="done" type="button">Completed</button>
        </div>
      </div>
      <div class="tasks" id="taskList" aria-live="polite"></div>
    </section>
    <footer>StudyFlow · Built with HTML, CSS and JavaScript · Your tasks stay in this browser.</footer>
  </main>

  <script>
    const STORAGE_KEY = "studyflow_tasks_v1";
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentFilter = "all";

    document.getElementById("today").textContent =
      new Intl.DateTimeFormat("en-IN", { weekday:"short", day:"numeric", month:"short", year:"numeric" }).format(new Date());

    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const priorityInput = document.getElementById("priority");
    const taskList = document.getElementById("taskList");

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      const completed = tasks.filter(task => task.done).length;
      document.getElementById("total").textContent = tasks.length;
      document.getElementById("remaining").textContent = tasks.length - completed;
      document.getElementById("completed").textContent = completed;

      const visibleTasks = tasks.filter(task =>
        currentFilter === "all" ||
        (currentFilter === "active" && !task.done) ||
        (currentFilter === "done" && task.done)
      );

      taskList.innerHTML = "";
      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tasks.length === 0 ? "No tasks yet. Add your first task above!" : "Nothing to show here.";
        taskList.appendChild(empty);
        return;
      }

      visibleTasks.forEach(task => {
        const row = document.createElement("div");
        row.className = `task${task.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Mark ${task.title} as ${task.done ? "not completed" : "completed"}`);
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const main = document.createElement("div");
        main.className = "task-main";
        const title = document.createElement("div");
        title.className = "task-title";
        title.textContent = task.title;
        const priority = document.createElement("span");
        priority.className = `priority ${task.priority}`;
        priority.textContent = `${task.priority} priority`;
        main.append(title, priority);

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", `Delete ${task.title}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        row.append(checkbox, main, remove);
        taskList.appendChild(row);
      });
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;
      tasks.unshift({
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
        title,
        priority: priorityInput.value,
        done: false
      });
      saveTasks();
      taskForm.reset();
      priorityInput.value = "Medium";
      taskInput.focus();
      renderTasks();
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
